<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', 'Courier New', Courier, monospace;
        }

        /* Матричный фон */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Эффект тревоги (хардкорное мигание) */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: rgba(255, 0, 0, 0);
            animation: redAlert 0.4s infinite alternate;
        }

        @keyframes redAlert {
            0% { background: rgba(255, 0, 0, 0); }
            100% { background: rgba(255, 0, 0, 0.15); }
        }

        /* Консоль */
        .terminal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 750px;
            height: 480px;
            background-color: rgba(5, 5, 5, 0.9);
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px #ff0055;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background-color: #1a0008;
            border-bottom: 2px solid #ff0055;
            padding: 10px 15px;
            color: #ff0055;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .terminal-body {
            padding: 15px;
            color: #ff3366;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
        }

        .critical {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
        }

        .warning { color: #ffcc00; }
        .destruct { color: #ff0055; font-weight: bold; font-size: 15px; }

        /* ЭКРАН ВЫКЛЮЧЕНИЯ WINDOWS */
        .windows-shutdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #004275; /* Фирменный синий цвет Windows */
            z-index: 100;
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .shutdown-text {
            font-size: 26px;
            font-weight: 300;
            margin-bottom: 30px;
        }

        /* Крутящиеся точки Windows */
        .win-spinner {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .win-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            transform: rotate(225deg);
            animation: orbit 5.5s infinite;
        }

        .win-dot:nth-child(1) { animation-delay: 240ms; }
        .win-dot:nth-child(2) { animation-delay: 480ms; }
        .win-dot:nth-child(3) { animation-delay: 720ms; }
        .win-dot:nth-child(4) { animation-delay: 960ms; }
        .win-dot:nth-child(5) { animation-delay: 1200ms; }

        @keyframes orbit {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(690deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: ease-out; }
            76% { transform: rotate(945deg); opacity: 0; }
            100% { transform: rotate(945deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glitch-overlay"></div>
    <canvas id="matrix"></canvas>

    <div class="terminal">
        <div class="terminal-header">
            <span>⚠️ SYSTEM_OVERRIDE.EXE</span>
            <span class="critical">HARDCORE BREACH</span>
        </div>
        <div class="terminal-body" id="logs"></div>
    </div>

    <!-- Синий экран выключения -->
    <div class="windows-shutdown" id="shutdownScreen">
        <div class="win-spinner">
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
        </div>
        <div class="shutdown-text">Выключение</div>
    </div>

    <script>
        // 1. Агрессивная матрица (Красные/Зеленые оттенки)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        const chars = '01'.split('');
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < rainDrops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillStyle = Math.random() > 0.8 ? '#ff0055' : '#00ff33'; // Смесь красного и зеленого хаоса
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.98) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 20);

        // 2. Логи тотального уничтожения
        const logs = document.getElementById('logs');
        const hardLogs = [
            "[CRITICAL] Обход корневой защиты ядра систем...",
            "[ALERT] Внедрение вредоносного payload в процесс lsass.exe",
            "[WARNING] Попытка блокировки со стороны антивируса... Подавлено!",
            "[FATAL] Удаление таблицы разделов диска (MBR Override)...",
            "[CRITICAL] Переполнение буфера памяти. Стек уничтожен.",
            "[SYSTEM] Вызов прерывания ядра INT 19h (Перезагрузка)...",
            "[HARDCORE] Стирание каталогов System32 и SysWOW64...",
            "[💥 DESTROY] Полный захват шины питания материнской платы..."
        ];

        function addLog() {
            const line = hardLogs[Math.floor(Math.random() * hardLogs.length)];
            const p = document.createElement('p');
            p.className = line.includes('💥') ? 'destruct' : (line.includes('CRITICAL') || line.includes('FATAL') ? 'critical' : 'warning');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
            logs.appendChild(p);
            logs.scrollTop = logs.scrollHeight;
        }

        // Спамим логами очень быстро
        const logInterval = setInterval(addLog, 150);

        // 3. Скрипт триггера выключения (через 10 секунд)
        setTimeout(() => {
            clearInterval(logInterval); // Останавливаем логи
            document.getElementById('shutdownScreen').style.display = 'flex'; // Показываем экран Windows
        }, 10000); // 10000 миллисекунд = 10 секунд
    </script>
</body>
</html>
