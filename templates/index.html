<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ SYSTEM CORRUPTION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: none;
        }

        /* ===== ПОЛНОЭКРАННЫЙ КОНТЕЙНЕР ===== */
        #container {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ===== БЫСТРЫЙ КОД В НАЧАЛЕ ===== */
        #fastCode {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            color: #00ff41;
            font-size: 0.6rem;
            line-height: 1.2;
            white-space: pre-wrap;
            word-break: break-all;
            opacity: 0;
            animation: fastCodeFlash 2s ease-out 0.3s forwards;
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 20px;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff4144;
        }

        @keyframes fastCodeFlash {
            0% {
                opacity: 0;
                transform: scale(1.1);
            }
            5% {
                opacity: 1;
                transform: scale(1);
            }
            95% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.05);
            }
        }

        /* ===== ЭФФЕКТ КРОВИ ПОД УГЛОМ ===== */
        #bloodOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            animation: bloodAppear 0.8s ease-out 2.2s forwards;
            background: 
                /* Кровь под углом - тёмные пятна */
                radial-gradient(ellipse at 20% 80%, rgba(120, 0, 0, 0.7) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(150, 0, 0, 0.6) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 0, 0, 0.3) 0%, transparent 70%),
                /* Кровавые потеки */
                repeating-linear-gradient(
                    -45deg,
                    transparent 0px,
                    transparent 50px,
                    rgba(80, 0, 0, 0.15) 50px,
                    rgba(80, 0, 0, 0.15) 52px
                ),
                repeating-linear-gradient(
                    45deg,
                    transparent 0px,
                    transparent 30px,
                    rgba(60, 0, 0, 0.1) 30px,
                    rgba(60, 0, 0, 0.1) 32px
                );
            transform: rotate(0deg);
        }

        @keyframes bloodAppear {
            0% {
                opacity: 0;
                transform: scale(1.3) rotate(-5deg);
            }
            30% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0.85;
                transform: scale(1) rotate(0deg);
            }
        }

        /* ===== КРОВАВЫЕ БРЫЗГИ ===== */
        .blood-splat {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(180, 0, 0, 0.8), rgba(80, 0, 0, 0.2));
            pointer-events: none;
            z-index: 11;
            opacity: 0;
            animation: splatAppear 1s ease-out forwards;
        }

        .blood-splat:nth-child(1) {
            width: 300px;
            height: 200px;
            top: 10%;
            right: 5%;
            transform: rotate(25deg);
            animation-delay: 2.5s;
        }

        .blood-splat:nth-child(2) {
            width: 250px;
            height: 350px;
            bottom: 5%;
            left: 10%;
            transform: rotate(-15deg);
            animation-delay: 2.8s;
            background: radial-gradient(ellipse, rgba(200, 0, 0, 0.6), rgba(60, 0, 0, 0.1));
        }

        .blood-splat:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 60%;
            transform: rotate(45deg);
            animation-delay: 3.1s;
            background: radial-gradient(ellipse, rgba(160, 0, 0, 0.7), rgba(40, 0, 0, 0.1));
        }

        @keyframes splatAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                opacity: 0.6;
                transform: scale(1) rotate(0deg);
            }
        }

        /* ===== ОШИБКИ (красные, страшные) ===== */
        #errorOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            animation: errorAppear 1.5s ease-out 2s forwards;
        }

        .error-text {
            position: absolute;
            color: #ff0040;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 30px #ff004088, 0 0 60px #ff004044;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            opacity: 0;
            animation: errorFlash 0.3s ease-out forwards;
            text-transform: uppercase;
        }

        .error-text:nth-child(1) {
            top: 15%;
            left: 10%;
            font-size: 3rem;
            animation-delay: 2.1s;
            transform: rotate(-3deg);
        }

        .error-text:nth-child(2) {
            top: 50%;
            right: 8%;
            font-size: 2.5rem;
            animation-delay: 2.4s;
            transform: rotate(5deg);
            color: #cc0033;
        }

        .error-text:nth-child(3) {
            bottom: 20%;
            left: 20%;
            font-size: 2rem;
            animation-delay: 2.7s;
            transform: rotate(-7deg);
            color: #ff0055;
        }

        .error-text:nth-child(4) {
            top: 30%;
            left: 50%;
            font-size: 1.8rem;
            animation-delay: 3.0s;
            transform: rotate(2deg);
            color: #990033;
            text-shadow: 0 0 40px #99003388;
        }

        .error-text:nth-child(5) {
            bottom: 40%;
            right: 20%;
            font-size: 2.2rem;
            animation-delay: 3.3s;
            transform: rotate(-4deg);
            color: #ff0033;
        }

        @keyframes errorFlash {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(0deg);
                text-shadow: none;
            }
            20% {
                opacity: 1;
                transform: scale(1.3) rotate(3deg);
                text-shadow: 0 0 50px #ff0040;
            }
            40% {
                opacity: 0.3;
                transform: scale(0.9) rotate(-2deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.1) rotate(1deg);
                text-shadow: 0 0 30px #ff004088;
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                text-shadow: 0 0 20px #ff004066;
            }
        }

        @keyframes errorAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ===== ЧЁРНЫЙ ЭКРАН ПОСЛЕ ВСЕГО ===== */
        #blackScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            animation: blackOut 0.5s ease-out 4s forwards;
        }

        @keyframes blackOut {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
                pointer-events: all;
            }
        }

        /* ===== ФИНАЛЬНЫЙ КОД ПОСЛЕ ЧЁРНОГО ЭКРАНА ===== */
        #finalCode {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25;
            color: #00ff41;
            font-size: 0.7rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            opacity: 0;
            pointer-events: none;
            animation: finalCodeAppear 0.5s ease-out 5s forwards;
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #000;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff4122;
        }

        @keyframes finalCodeAppear {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
        }

        /* ===== МЕРЦАЮЩИЙ КУРСОР В КОНЦЕ ===== */
        #cursor {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 30;
            color: #00ff41;
            font-size: 1.2rem;
            opacity: 0;
            animation: cursorAppear 0.5s ease-out 6s forwards;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        #cursor .blink {
            display: inline-block;
            width: 12px;
            height: 1.2em;
            background: #00ff41;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
            margin-left: 5px;
        }

        @keyframes cursorAppear {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }

        /* ===== СТРАШНЫЙ ШУМ ===== */
        #noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 1px,
                rgba(255, 0, 0, 0.02) 1px,
                rgba(255, 0, 0, 0.02) 2px
            );
            animation: noiseMove 0.03s steps(3) infinite;
            opacity: 0.5;
        }

        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-3px, 3px); }
        }

        /* ===== БЫСТРОЕ МЕРЦАНИЕ ЭКРАНА ===== */
        #flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background: #000;
            opacity: 0;
            animation: flickerEffect 2s ease-out 1.5s forwards;
        }

        @keyframes flickerEffect {
            0% { opacity: 0; }
            5% { opacity: 0.9; }
            10% { opacity: 0; }
            15% { opacity: 0.8; }
            20% { opacity: 0; }
            25% { opacity: 1; }
            30% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 600px) {
            .error-text {
                font-size: 1rem !important;
            }
            .error-text:nth-child(1) { font-size: 1.5rem !important; }
            .error-text:nth-child(2) { font-size: 1.2rem !important; }
            #fastCode {
                font-size: 0.4rem;
                padding: 10px;
            }
            #finalCode {
                font-size: 0.5rem;
                padding: 10px;
            }
            .blood-splat {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="container">

    <!-- ШУМ -->
    <div id="noise"></div>

    <!-- МЕРЦАНИЕ -->
    <div id="flicker"></div>

    <!-- ===== БЫСТРЫЙ КОД (в начале) ===== -->
    <div id="fastCode" id="fastCode"></div>

    <!-- ===== КРОВЬ ПОД УГЛОМ ===== -->
    <div id="bloodOverlay"></div>

    <!-- ===== КРОВАВЫЕ БРЫЗГИ ===== -->
    <div class="blood-splat"></div>
    <div class="blood-splat"></div>
    <div class="blood-splat"></div>

    <!-- ===== СТРАШНЫЕ ОШИБКИ ===== -->
    <div id="errorOverlay">
        <div class="error-text">⚠️ SYSTEM FAILURE ⚠️</div>
        <div class="error-text">💀 CRITICAL ERROR 💀</div>
        <div class="error-text">🔥 DATA CORRUPTED 🔥</div>
        <div class="error-text">⚡ MEMORY DUMP ⚡</div>
        <div class="error-text">❌ ACCESS DENIED ❌</div>
    </div>

    <!-- ===== ЧЁРНЫЙ ЭКРАН ===== -->
    <div id="blackScreen"></div>

    <!-- ===== ФИНАЛЬНЫЙ КОД ===== -->
    <div id="finalCode"></div>

    <!-- ===== КУРСОР ===== -->
    <div id="cursor">
        <span style="color: #ff0040;">▶</span> SYSTEM RECOVERED <span class="blink"></span>
    </div>

</div>

<script>
    // ===== ГЕНЕРАЦИЯ БЫСТРОГО КОДА =====
    (function generateFastCode() {
        const el = document.getElementById('fastCode');
        const lines = [];
        const strings = [
            'ERROR: 0xDEADBEEF', 'SEGFAULT', 'KERNEL PANIC', 'DATA LOSS',
            'MEMORY CORRUPTION', 'STACK OVERFLOW', 'HEAP CORRUPTION',
            'INVALID POINTER', 'ACCESS VIOLATION', 'SYSTEM CRASH',
            'FATAL EXCEPTION', 'UNHANDLED INTERRUPT', 'DMA FAILURE',
            'PCIe ERROR', 'BIOS CORRUPT', 'BOOT FAILURE', 'DISK ERROR',
            'FS CORRUPTION', 'INODE LOST', 'JOURNAL ERROR'
        ];

        // Генерируем 50-70 строк быстрого кода
        for (let i = 0; i < 80; i++) {
            const randomHex = Math.random().toString(16).substring(2, 10).toUpperCase();
            const randomString = strings[Math.floor(Math.random() * strings.length)];
            const randomNum = Math.floor(Math.random() * 9999);
            const prefix = ['[ERR]', '[WARN]', '[FATAL]', '[CRIT]', '[PANIC]'][Math.floor(Math.random() * 5)];
            const color = ['#ff0040', '#ff4400', '#ff0044', '#cc0033'][Math.floor(Math.random() * 4)];
            lines.push(`<span style="color:${color}">${prefix}</span> ${randomString} 0x${randomHex} at ${randomNum}\n`);
        }

        el.innerHTML = lines.join('').repeat(2);
    })();

    // ===== ГЕНЕРАЦИЯ ФИНАЛЬНОГО КОДА =====
    (function generateFinalCode() {
        const el = document.getElementById('finalCode');
        const lines = [];
        const hexBytes = ['0x00', '0xFF', '0x3F', '0xAA', '0x55', '0xCC', '0x33', '0x99', '0x66', '0x11'];

        for (let i = 0; i < 200; i++) {
            const hex = hexBytes[Math.floor(Math.random() * hexBytes.length)];
            const num = Math.floor(Math.random() * 255);
            const hexStr = num.toString(16).toUpperCase().padStart(2, '0');
            const prefix = ['DB', 'DW', 'DD', 'DQ'][Math.floor(Math.random() * 4)];
            const label = `L${Math.floor(Math.random() * 9999)}`;
            const ascii = String.fromCharCode(32 + Math.random() * 95);
            lines.push(`${label}: ${prefix} 0x${hexStr} ${hex} ; '${ascii}'`);
        }

        // Добавляем ассемблерный код
        const asm = [
            'mov eax, 0xDEADBEEF',
            'xor ebx, ebx',
            'push eax',
            'call 0x7FFF8A3B',
            'pop eax',
            'jmp 0x0000FFFF',
            'ret',
            'nop',
            'int 0x80',
            'syscall'
        ];

        for (let i = 0; i < 20; i++) {
            const instr = asm[Math.floor(Math.random() * asm.length)];
            const addr = `0x${Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase().padStart(4, '0')}`;
            lines.push(`[${addr}] ${instr}`);
        }

        // Добавляем шестнадцатеричный дамп
        for (let i = 0; i < 50; i++) {
            let hexLine = '';
            for (let j = 0; j < 16; j++) {
                hexLine += Math.floor(Math.random() * 255).toString(16).toUpperCase().padStart(2, '0') + ' ';
            }
            const addr = `0x${(i * 16).toString(16).toUpperCase().padStart(8, '0')}`;
            lines.push(`${addr}: ${hexLine}`);
        }

        el.textContent = lines.join('\n');
    })();

    // ===== ЭФФЕКТ МЕРЦАНИЯ И ГЛИТЧА =====
    (function glitchEffects() {
        const container = document.getElementById('container');

        // Случайные вспышки в процессе
        setInterval(() => {
            if (Math.random() < 0.08) {
                container.style.filter = `brightness(${0.5 + Math.random() * 1.5}) contrast(${0.8 + Math.random() * 0.4})`;
                setTimeout(() => {
                    container.style.filter = 'none';
                }, 150);
            }
        }, 500);

        // Красные вспышки
        setInterval(() => {
            if (Math.random() < 0.03) {
                const flash = document.createElement('div');
                flash.style.cssText = `
                    position: absolute;
                    top: 0; left: 0;
                    width: 100%; height: 100%;
                    background: rgba(255, 0, 0, 0.3);
                    z-index: 15;
                    pointer-events: none;
                `;
                container.appendChild(flash);
                setTimeout(() => flash.remove(), 100);
            }
        }, 1000);
    })();

    // ===== ЗВУКОВОЙ ЭФФЕКТ (страшный гул) =====
    (function playHorrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Низкий гул
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(55, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 2);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            oscillator.start(audioCtx.currentTime + 1);
            oscillator.stop(audioCtx.currentTime + 3);

            // Высокий шум (как помеха)
            const noise = audioCtx.createBufferSource();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            noise.start(audioCtx.currentTime + 0.5);
            noise.stop(audioCtx.currentTime + 2.5);

        } catch(e) { /* тихо */ }
    })();

    // ===== СТРАШНЫЙ ТЕКСТ В КОНСОЛИ =====
    console.log('%c⚠️ SYSTEM CORRUPTED ⚠️', 'color: #ff0040; font-size: 40px; font-weight: bold;');
    console.log('%cYOU SHOULD NOT BE HERE', 'color: #ff0040; font-size: 20px;');
    console.log('%cDATA LOSS DETECTED', 'color: #ff0040; font-size: 16px;');

    // ===== ПРОСЬБА ВКЛЮЧИТЬ ПОЛНОЭКРАННЫЙ РЕЖИМ =====
    document.addEventListener('click', () => {
        if (document.fullscreenElement) return;
        document.documentElement.requestFullscreen?.().catch(() => {});
    });

    // Автоматический полноэкранный режим при загрузке
    setTimeout(() => {
        document.documentElement.requestFullscreen?.().catch(() => {});
    }, 1000);
</script>

</body>
</html>
