<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM MALFUNCTION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020202;
            font-family: monospace;
        }

        /* Зона взлома */
        .stage {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Консоль */
        .hacker-console {
            width: 90%;
            max-width: 800px;
            height: 500px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ff33;
            box-shadow: 0 0 30px rgba(0, 255, 51, 0.2);
            display: flex;
            flex-direction: column;
        }

        .console-header {
            background: #0a0a0a;
            padding: 10px 15px;
            border-bottom: 1px solid #00ff33;
            color: #00ff33;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .console-body {
            padding: 20px;
            color: #00ff33;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Цвета логов */
        .ln-info { color: #00ff33; }
        .ln-warn { color: #ffcc00; }
        .ln-danger { color: #ff0033; font-weight: bold; }
        
        /* Визуальный перекос экрана (эффект вируса) */
        .virus-glitch {
            animation: screen-shake 0.15s infinite alternate;
        }

        @keyframes screen-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); filter: hue-rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(0.5deg); filter: hue-rotate(45deg); }
        }

        /* Скрытый оверлей смерти железа */
        .hardware-dead {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }

        /* Тот самый реалистичный экран выключения с МНОЖЕСТВОМ кружочков по кругу */
        .classic-shutdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #004b7e; /* Насыщенный глубокий Windows-синий */
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }

        /* Круг из множества медленных точек */
        .dots-circle {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 30px;
        }

        .circle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            top: 0; left: 27px;
            transform-origin: 3px 30px;
            opacity: 0;
            animation: slow-fade-orbit 2.4s infinite linear;
        }

        /* Создаем 12 точек, расположенных по кругу */
        .circle-dot:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
        .circle-dot:nth-child(2) { transform: rotate(30deg); animation-delay: 0.2s; }
        .circle-dot:nth-child(3) { transform: rotate(60deg); animation-delay: 0.4s; }
        .circle-dot:nth-child(4) { transform: rotate(90deg); animation-delay: 0.6s; }
        .circle-dot:nth-child(5) { transform: rotate(120deg); animation-delay: 0.8s; }
        .circle-dot:nth-child(6) { transform: rotate(150deg); animation-delay: 1.0s; }
        .circle-dot:nth-child(7) { transform: rotate(180deg); animation-delay: 1.2s; }
        .circle-dot:nth-child(8) { transform: rotate(210deg); animation-delay: 1.4s; }
        .circle-dot:nth-child(9) { transform: rotate(240deg); animation-delay: 1.6s; }
        .circle-dot:nth-child(10) { transform: rotate(270deg); animation-delay: 1.8s; }
        .circle-dot:nth-child(11) { transform: rotate(300deg); animation-delay: 2.0s; }
        .circle-dot:nth-child(12) { transform: rotate(330deg); animation-delay: 2.2s; }

        @keyframes slow-fade-orbit {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .shutdown-label {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="hardware-dead" id="flash"></div>

    <div class="stage" id="mainStage">
        <div class="hacker-console" id="consoleWindow">
            <div class="console-header">
                <span>☠️ MEMORY_EXPLOIT.SH</span>
                <span>STATUS: RUNNING</span>
            </div>
            <div class="console-body" id="logs"></div>
        </div>
    </div>

    <!-- Реалистичный экран медленного циклического выключения -->
    <div class="classic-shutdown" id="shutdownScreen">
        <div class="dots-circle">
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
            <div class="circle-dot"></div>
        </div>
        <div class="shutdown-label">Выключение</div>
    </div>

    <script>
        const logsContainer = document.getElementById('logs');
        const consoleWindow = document.getElementById('consoleWindow');
        const shutdownScreen = document.getElementById('shutdownScreen');
        const flash = document.getElementById('flash');

        const attackSteps = [
            { t: "[INFO] Инициализация червя 'Worm.Win32.Overkill'...", type: 'ln-info' },
            { t: "[OK] Поиск дескрипторов процессов безопасности...", type: 'ln-info' },
            { t: "[WARN] Антивирус пытается заблокировать сессию... Подавление...", type: 'ln-warn' },
            { t: "[SUCCESS] Защитник Windows отключен через реестр.", type: 'ln-info' },
            { t: "[INFO] Инъекция шелл-кода в процесс wininit.exe...", type: 'ln-info' },
            { t: "[OK] Доступ к Ring 0 (ядро системы) подтвержден.", type: 'ln-info' },
            { t: "[DANGER] ВНИМАНИЕ: Начата перезапись таблицы разделов диска (GUID)...", type: 'ln-danger' },
            { t: "[DANGER] Стирание секторов: 10%.. 35%.. 70%.. 100%", type: 'ln-danger' },
            { t: "[WARN] Внутренняя температура чипсета превысила 92°C!", type: 'ln-warn' },
            { t: "[INFO] Перехват шины управления питанием ACPI...", type: 'ln-info' },
            { t: "[DANGER] Отправка принудительного сигнала отключения ACPI_STATE_S5...", type: 'ln-danger' },
            { t: "[CRITICAL FAILURE] Сбой питания. Система уничтожена.", type: 'ln-danger' }
        ];

        let currentStep = 0;

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('p');
                p.className = step.type;
                p.textContent = `[${new Date().toLocaleTimeString()}] ${step.t}`;
                logsContainer.appendChild(p);
                logsContainer.scrollTop = logsContainer.scrollHeight;

                // Ближе к концу вирус начинает ломать экран
                if (currentStep === 6) {
                    consoleWindow.classList.add('virus-glitch');
                }

                currentStep++;
                // Случайная реалистичная задержка между шагами
                setTimeout(printLog, Math.random() * 600 + 400);
            } else {
                // ФИНАЛЬНЫЙ АККОРД: Короткая белая вспышка, как при аппаратном сбое питания
                flash.style.opacity = '1';
                
                setTimeout(() => {
                    // Прячем старую консоль
                    document.getElementById('mainStage').style.display = 'none';
                    flash.style.opacity = '0';
                    
                    // Показываем тот самый чистый, медленный экран завершения работы
                    shutdownScreen.style.display = 'flex';
                }, 250);
            }
        }

        // Запуск вирусной цепочки через 1 секунду после открытия сайта
        setTimeout(printLog, 1000);
    </script>
</body>
</html>
