<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM FATAL EXPLOIT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }

        /* Главный контейнер, который мы целиком повернем в конце */
        #viewport-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #020202;
            transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
            transform-origin: center center;
        }

        /* Зона взлома */
        .stage {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Консоль */
        .hacker-console {
            width: 90%;
            max-width: 820px;
            height: 520px;
            background: rgba(0, 0, 0, 0.96);
            border: 1px solid #00ff33;
            box-shadow: 0 0 35px rgba(0, 255, 51, 0.15);
            display: flex;
            flex-direction: column;
        }

        .console-header {
            background: #080808;
            padding: 12px 15px;
            border-bottom: 1px solid #00ff33;
            color: #00ff33;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .console-body {
            padding: 20px;
            color: #00ff33;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Цвета логов */
        .ln-info { color: #00ff33; }
        .ln-warn { color: #ffcc00; }
        .ln-danger { color: #ff0033; font-weight: bold; }
        
        /* Жесткая тряска экрана */
        .virus-glitch {
            animation: screen-shake 0.1s infinite alternate;
        }

        @keyframes screen-shake {
            0% { transform: translate(2px, 1px) rotate(0deg); filter: contrast(120%); }
            100% { transform: translate(-2px, -1px) rotate(0.2deg); filter: contrast(150%) hue-rotate(10deg); }
        }

        /* Аппаратная вспышка */
        .hardware-dead {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease;
        }

        /* Экран выключения */
        .classic-shutdown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #004b7e;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }

        /* Круг из 12 точек */
        .dots-circle {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 30px;
        }

        .circle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            top: 0; left: 27px;
            transform-origin: 3px 30px;
            opacity: 0;
            animation: slow-fade-orbit 2.4s infinite linear;
        }

        .circle-dot:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
        .circle-dot:nth-child(2) { transform: rotate(30deg); animation-delay: 0.2s; }
        .circle-dot:nth-child(3) { transform: rotate(60deg); animation-delay: 0.4s; }
        .circle-dot:nth-child(4) { transform: rotate(90deg); animation-delay: 0.6s; }
        .circle-dot:nth-child(5) { transform: rotate(120deg); animation-delay: 0.8s; }
        .circle-dot:nth-child(6) { transform: rotate(150deg); animation-delay: 1.0s; }
        .circle-dot:nth-child(7) { transform: rotate(180deg); animation-delay: 1.2s; }
        .circle-dot:nth-child(8) { transform: rotate(210deg); animation-delay: 1.4s; }
        .circle-dot:nth-child(9) { transform: rotate(240deg); animation-delay: 1.6s; }
        .circle-dot:nth-child(10) { transform: rotate(270deg); animation-delay: 1.8s; }
        .circle-dot:nth-child(11) { transform: rotate(300deg); animation-delay: 2.0s; }
        .circle-dot:nth-child(12) { transform: rotate(330deg); animation-delay: 2.2s; }

        @keyframes slow-fade-orbit {
            0% { opacity: 1; }
            50% { opacity: 0.15; }
            100% { opacity: 1; }
        }

        .shutdown-label {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Класс для полной остановки анимаций при зависании */
        .frozen-glitch * {
            animation-play-state: paused !important;
            transition: none !important;
        }
    </style>
</head>
<body>

    <!-- Вся картинка внутри этого вращаемого слоя, а под ним — чистый черный фон body -->
    <div id="viewport-wrapper">
        <div class="hardware-dead" id="flash"></div>

        <div class="stage" id="mainStage">
            <div class="hacker-console" id="consoleWindow">
                <div class="console-header">
                    <span>☠️ ROOT_KERNEL_ATTACK.SH</span>
                    <span>STATUS: INJECTING</span>
                </div>
                <div class="console-body" id="logs"></div>
            </div>
        </div>

        <div class="classic-shutdown" id="shutdownScreen">
            <div class="dots-circle" id="loaderCircle">
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
            </div>
            <div class="shutdown-label">Выключение</div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');
        const consoleWindow = document.getElementById('consoleWindow');
        const shutdownScreen = document.getElementById('shutdownScreen');
        const flash = document.getElementById('flash');

        const attackSteps = [
            { t: "[INFO] Подключение к шине PCI Express...", type: 'ln-info' },
            { t: "[OK] Поиск уязвимостей в драйвере дисплея...", type: 'ln-info' },
            { t: "[WARN] Обнаружен процесс ядра Antivirus. Ожидание сигнатуры...", type: 'ln-warn' },
            { t: "[SUCCESS] Защита ядра Ring-0 скомпрометирована.", type: 'ln-info' },
            { t: "[INFO] Чтение дампа дескрипторов памяти lsass.exe...", type: 'ln-info' },
            { t: "[OK] Ключи шифрования SAM извлечены.", type: 'ln-info' },
            { t: "[WARN] Попытка системы восстановить стек вызовов...", type: 'ln-warn' },
            { t: "[DANGER] БЛОКИРОВКА: Начат деструктивный обход MBR/GPT...", type: 'ln-danger' },
            { t: "[DANGER] Перезапись секторов хранения данных: 12%.. 44%.. 89%..", type: 'ln-danger' },
            { t: "[OK] Таблица разделов уничтожена.", type: 'ln-info' },
            { t: "[WARN] Перегрев кристалла процессора! Текущая: 94°C", type: 'ln-warn' },
            { t: "[INFO] Принудительная отправка ACPI-пакета S5 (Shutdown)...", type: 'ln-info' },
            { t: "[DANGER] Аппаратное прерывание BIOS INT 15h вызвано.", type: 'ln-danger' },
            { t: "[CRITICAL] Потеря контроля питания материнской платы.", type: 'ln-danger' }
        ];

        let currentStep = 0;

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('p');
                p.className = step.type;
                p.textContent = `[${new Date().toLocaleTimeString()}] ${step.t}`;
                logsContainer.appendChild(p);
                logsContainer.scrollTop = logsContainer.scrollHeight;

                if (currentStep === 7) {
                    consoleWindow.classList.add('virus-glitch');
                }

                currentStep++;
                setTimeout(printLog, Math.random() * 700 + 500);
            } else {
                flash.style.opacity = '1';
                
                setTimeout(() => {
                    document.getElementById('mainStage').style.display = 'none';
                    flash.style.opacity = '0';
                    shutdownScreen.style.display = 'flex';
                    
                    setTimeout(() => {
                        wrapper.style.transform = "rotate(43deg) scale(0.85)";
                        
                        setTimeout(() => {
                            document.body.classList.add('frozen-glitch');
                            wrapper.classList.add('frozen-glitch');
                        }, 50);
                        
                    }, 4000); 

                }, 200);
            }
        }

        setTimeout(printLog, 1000);
    </script>
</body>
</html>
