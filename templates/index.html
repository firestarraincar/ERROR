<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ SYSTEM CORRUPTION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: default;
        }

        #container {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ===== КНОПКА ERROR ПОД УГЛОМ ===== */
        #errorBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            z-index: 50;
            background: transparent;
            border: 3px solid #ff0040;
            color: #ff0040;
            font-family: 'Courier New', monospace;
            font-size: 3.5rem;
            font-weight: bold;
            padding: 30px 60px;
            cursor: pointer;
            letter-spacing: 8px;
            text-shadow: 0 0 30px #ff004066, 0 0 60px #ff004033;
            box-shadow: 0 0 50px rgba(255, 0, 64, 0.2);
            transition: all 0.3s;
            animation: btnPulse 1.5s ease-in-out infinite;
            text-transform: uppercase;
        }

        #errorBtn:hover {
            background: rgba(255, 0, 64, 0.2);
            box-shadow: 0 0 80px rgba(255, 0, 64, 0.4);
            transform: translate(-50%, -50%) rotate(-10deg) scale(1.05);
        }

        @keyframes btnPulse {
            0%, 100% {
                text-shadow: 0 0 30px #ff004066, 0 0 60px #ff004033;
                box-shadow: 0 0 50px rgba(255, 0, 64, 0.2);
            }
            50% {
                text-shadow: 0 0 50px #ff004099, 0 0 100px #ff004055;
                box-shadow: 0 0 80px rgba(255, 0, 64, 0.4);
            }
        }

        #errorBtn .sub {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 5px;
            opacity: 0.5;
            font-weight: normal;
        }

        /* ===== ГЛЮКИ ПОСЛЕ НАЖАТИЯ ===== */
        #glitchLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }

        #glitchLayer.active {
            opacity: 1;
        }

        /* Строки глюков */
        .glitch-line {
            position: absolute;
            color: #00ff41;
            font-size: 0.6rem;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== СМАЗЫВАНИЕ ЭКРАНА ===== */
        #motionBlur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 2px,
                    rgba(0, 255, 65, 0.01) 2px,
                    rgba(0, 255, 65, 0.01) 4px
                );
            transition: opacity 0.1s;
        }

        #motionBlur.active {
            opacity: 0.8;
            animation: blurShift 0.05s steps(2) infinite;
        }

        @keyframes blurShift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5px, -3px) scale(1.02); }
        }

        /* ===== СМАЗЫВАНИЕ (размытие) ===== */
        #blurOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 12;
            pointer-events: none;
            backdrop-filter: blur(0px);
            transition: backdrop-filter 0.1s;
        }

        #blurOverlay.active {
            backdrop-filter: blur(8px);
        }

        #blurOverlay.heavy {
            backdrop-filter: blur(20px);
        }

        /* ===== ЧЁРНЫЙ ЭКРАН ===== */
        #blackScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #blackScreen.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ===== ТЕКСТ НА ЧЁРНОМ ЭКРАНЕ ===== */
        #blackText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 35;
            color: #00ff41;
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            text-shadow: 0 0 30px #00ff4144;
            letter-spacing: 3px;
        }

        #blackText.active {
            opacity: 1;
            pointer-events: all;
        }

        #blackText .blink {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background: #00ff41;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #blackText .small {
            font-size: 0.7rem;
            color: #00ff4166;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        /* ===== ШУМ ===== */
        #noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 1px,
                rgba(0, 255, 65, 0.015) 1px,
                rgba(0, 255, 65, 0.015) 2px
            );
            animation: noiseMove 0.03s steps(3) infinite;
            opacity: 0.3;
        }

        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-2px, 2px); }
        }

        /* ===== АНИМАЦИЯ ИСЧЕЗНОВЕНИЯ КНОПКИ ===== */
        #errorBtn.hidden {
            animation: btnDisappear 0.8s ease-out forwards;
        }

        @keyframes btnDisappear {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-12deg) scale(1);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-8deg) scale(1.3);
                box-shadow: 0 0 100px rgba(255, 0, 64, 0.8);
            }
            60% {
                opacity: 0.5;
                transform: translate(-50%, -50%) rotate(-15deg) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(-20deg) scale(0);
            }
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 600px) {
            #errorBtn {
                font-size: 1.8rem;
                padding: 20px 30px;
                letter-spacing: 4px;
            }
            #errorBtn .sub {
                font-size: 0.6rem;
            }
            #blackText {
                font-size: 1rem;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div id="container">

    <!-- ШУМ -->
    <div id="noise"></div>

    <!-- ===== КНОПКА ERROR ПОД УГЛОМ ===== -->
    <button id="errorBtn">
        ⚠️ ERROR
        <span class="sub">▶ PRESS TO BREACH ◀</span>
    </button>

    <!-- ===== СЛОЙ ГЛЮКОВ ===== -->
    <div id="glitchLayer"></div>

    <!-- ===== СМАЗЫВАНИЕ ===== -->
    <div id="motionBlur"></div>
    <div id="blurOverlay"></div>

    <!-- ===== ЧЁРНЫЙ ЭКРАН ===== -->
    <div id="blackScreen"></div>

    <!-- ===== ТЕКСТ НА ЧЁРНОМ ЭКРАНЕ ===== -->
    <div id="blackText">
        <div style="font-size: 2rem; color: #ff0040; margin-bottom: 20px;">⚠️ SYSTEM OFFLINE ⚠️</div>
        <div>CONNECTION LOST</div>
        <div style="font-size: 0.8rem; margin-top: 10px; color: #00ff4166;">
            ATTEMPTING TO RECONNECT<span class="blink"></span>
        </div>
        <div class="small">
            <span style="color: #ff0040;">▶</span> DATA CORRUPTED
        </div>
        <div class="small" style="margin-top: 5px; color: #ff004066;">
            ERROR CODE: 0xDEADBEEF
        </div>
    </div>

</div>

<script>
    // ===== ГЕНЕРАЦИЯ ГЛЮКОВ =====
    function generateGlitches() {
        const layer = document.getElementById('glitchLayer');
        const glitchTexts = [
            'ERROR', 'SEGFAULT', 'KERNEL PANIC', 'DATA LOSS',
            'MEMORY CORRUPT', 'STACK OVERFLOW', 'HEAP CORRUPT',
            'ACCESS VIOLATION', 'SYSTEM CRASH', 'FATAL EXCEPTION',
            'UNHANDLED INTERRUPT', 'DMA FAILURE', 'PCIe ERROR',
            'BIOS CORRUPT', 'BOOT FAILURE', 'DISK ERROR',
            'FS CORRUPTION', 'INODE LOST', 'JOURNAL ERROR',
            '0xDEADBEEF', '0xCAFEBABE', '0xBAADF00D'
        ];

        for (let i = 0; i < 30; i++) {
            const line = document.createElement('div');
            line.className = 'glitch-line';
            line.textContent = glitchTexts[Math.floor(Math.random() * glitchTexts.length)];
            line.style.left = Math.random() * 90 + '%';
            line.style.top = Math.random() * 90 + '%';
            line.style.fontSize = (0.4 + Math.random() * 1.2) + 'rem';
            line.style.color = ['#ff0040', '#00ff41', '#ffcc00', '#ff00ff', '#00ffff'][Math.floor(Math.random() * 5)];
            line.style.opacity = 0.2 + Math.random() * 0.8;
            line.style.transform = `rotate(${(Math.random() - 0.5) * 10}deg)`;
            line.style.textShadow = `0 0 ${10 + Math.random() * 30}px currentColor`;
            layer.appendChild(line);
        }
    }

    // ===== ГЛЮК-ЭФФЕКТЫ (постоянные) =====
    function startGlitchEffects() {
        const container = document.getElementById('container');
        const glitchLayer = document.getElementById('glitchLayer');
        const motionBlur = document.getElementById('motionBlur');
        const blurOverlay = document.getElementById('blurOverlay');
        const blackScreen = document.getElementById('blackScreen');
        const blackText = document.getElementById('blackText');

        // Активируем слои
        glitchLayer.classList.add('active');
        motionBlur.classList.add('active');
        blurOverlay.classList.add('active');

        // Перемещение строк глюков
        const glitchLines = document.querySelectorAll('.glitch-line');
        let glitchInterval = setInterval(() => {
            glitchLines.forEach(line => {
                if (Math.random() < 0.3) {
                    line.style.left = (Math.random() * 90) + '%';
                    line.style.top = (Math.random() * 90) + '%';
                    line.style.opacity = 0.2 + Math.random() * 0.8;
                    line.style.transform = `rotate(${(Math.random() - 0.5) * 15}deg) scale(${0.8 + Math.random() * 0.4})`;
                }
                if (Math.random() < 0.1) {
                    line.style.color = ['#ff0040', '#00ff41', '#ffcc00', '#ff00ff', '#00ffff'][Math.floor(Math.random() * 5)];
                }
            });
        }, 200);

        // Смазывание экрана (сдвиг)
        let blurInterval = setInterval(() => {
            if (Math.random() < 0.4) {
                const shiftX = (Math.random() - 0.5) * 20;
                const shiftY = (Math.random() - 0.5) * 20;
                motionBlur.style.transform = `translate(${shiftX}px, ${shiftY}px) scale(${1 + (Math.random() - 0.5) * 0.05})`;
            }
            if (Math.random() < 0.2) {
                blurOverlay.classList.toggle('heavy');
            }
            if (Math.random() < 0.05) {
                container.style.filter = `brightness(${0.3 + Math.random() * 0.7})`;
                setTimeout(() => { container.style.filter = 'none'; }, 100);
            }
        }, 100);

        // Через 5-7 секунд — ЧЁРНЫЙ ЭКРАН
        const blackDelay = 5000 + Math.random() * 3000;
        setTimeout(() => {
            // Останавливаем глюки
            clearInterval(glitchInterval);
            clearInterval(blurInterval);

            // Плавно убираем глюки
            glitchLayer.style.transition = 'opacity 0.5s';
            glitchLayer.style.opacity = '0';
            motionBlur.style.transition = 'opacity 0.5s';
            motionBlur.style.opacity = '0';
            blurOverlay.style.transition = 'backdrop-filter 0.5s';
            blurOverlay.classList.remove('active');

            // Чёрный экран
            setTimeout(() => {
                blackScreen.classList.add('active');
                setTimeout(() => {
                    blackText.classList.add('active');
                }, 500);
            }, 500);

        }, blackDelay);

        // Сохраняем интервалы для очистки
        window._glitchIntervals = [glitchInterval, blurInterval];
    }

    // ===== ОБРАБОТЧИК КНОПКИ =====
    document.getElementById('errorBtn').addEventListener('click', function() {
        // Скрываем кнопку с анимацией
        this.classList.add('hidden');

        // Генерируем глюки
        generateGlitches();

        // Запускаем эффекты через небольшую задержку
        setTimeout(() => {
            startGlitchEffects();
        }, 800);
    });

    // ===== ЗВУКОВОЙ ЭФФЕКТ =====
    function playGlitchSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Шум
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gainNode = audioCtx.createGain();
            noise.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            noise.start(audioCtx.currentTime);
            noise.stop(audioCtx.currentTime + 1);

            // Гул
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 1);
            oscGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.start(audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 1.1);

        } catch(e) { /* тихо */ }
    }

    // Воспроизводим звук при нажатии
    document.getElementById('errorBtn').addEventListener('click', () => {
        setTimeout(playGlitchSound, 200);
    });

    // ===== АВТОМАТИЧЕСКИЙ ПОЛНОЭКРАННЫЙ РЕЖИМ =====
    document.addEventListener('click', () => {
        if (document.fullscreenElement) return;
        document.documentElement.requestFullscreen?.().catch(() => {});
    });

    // ===== СТРАШНАЯ КОНСОЛЬ =====
    console.log('%c⚠️ SYSTEM CORRUPTED ⚠️', 'color: #ff0040; font-size: 40px; font-weight: bold;');
    console.log('%cPRESS THE ERROR BUTTON... IF YOU DARE', 'color: #ff0040; font-size: 20px;');
</script>

</body>
</html>
