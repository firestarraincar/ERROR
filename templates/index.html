<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Diagnostic Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            /* Официальный строгий шрифт терминала */
            font-family: 'Consolas', 'Courier New', Courier, -apple-system, monospace;
        }

        /* Неброский фоновый барьер авторизации */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-btn {
            background: transparent;
            border: 1px solid #1f1f1f;
            color: #4a4a4a;
            padding: 12px 35px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 3px;
        }
        .start-btn:hover {
            border-color: #333333;
            color: #666666;
        }

        #viewport-wrapper {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none;
            padding: 20px 25px;
            overflow-y: auto;
        }

        .system-stage {
            width: 100%;
            color: #cccccc;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-line {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <!-- Необходим для корректного перехода в Fullscreen и выполнения скрипта закрытия -->
    <div class="start-overlay" id="gateOverlay">
        <button class="start-btn" onclick="initializeVirus()">Запустить</button>
    </div>

    <div id="viewport-wrapper">
        <div class="system-stage" id="logs"></div>
    </div>
    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');

        const cpuCores = navigator.hardwareConcurrency || 4;
        const userAgent = navigator.userAgent;
        
        let isMobile = /Android|iPhone|iPad|iPod/i.test(userAgent);
        let detectedOS = "Windows 10/11 x64 Pro Architecture";
        let pathPrefix = "C:\\Windows\\system32\\";
        
        // Меняем логику и пути, если жертва сидит с мобильного телефона
        if (isMobile) {
            detectedOS = "Android Linux Kernel v5.10.43-android12";
            pathPrefix = "/system/bin/";
        }

        // Объемный, правдивый и сухой список системных команд без киношных эффектов
        const attackSteps = [
            { t: isMobile ? "Android Debug Bridge (ADB) Daemon Active" : "Microsoft Windows [Version 10.0.22631.3165]" },
            { t: isMobile ? "Status: Connected to local shell process" : "(c) Корпорация Майкрософт (Microsoft Corporation). Все права защищены." },
            { t: "" },
            { t: `${pathPrefix}init_diagnostics --mode=silent` },
            { t: `[SYS_INFO] Найдено доступных ядер CPU: ${cpuCores} | Ядро платформы: ${detectedOS}` },
            { t: "[SYS_INFO] Проверка монтирования томов хранения данных..." },
            { t: isMobile ? "[PARTITION] Mount point: /data [ext4] - чтение/запись активны." : "[PARTITION] Раздел C:\\ [NTFS] - статус защиты от записи: отключен." },
            { t: "[SECURITY] Вызов удаленной аутентификации lsass.exe / bypass_vss..." },
            { t: "[SECURITY] Токен доступа повышен до NT AUTHORITY\\SYSTEM. Идентификатор сохранен." },
            { t: "[SERVICE] Остановка фоновой службы защиты файловой системы (WinDefend/KSM)..." },
            { t: "[SERVICE] Процесс успешно выгружен из таблицы дескрипторов ядра." },
            { t: "" },
            { t: "[NETWORK] Инициализация шифрованного канала RDP/TLSv1.3 на порту 3389..." },
            { t: "[NETWORK] Установлено сопряжение с удаленным шлюзом: 185.220.101.5 (Стокгольм, Швеция)" },
            { t: "[DATA_EXPORT] Считывание зашифрованных локальных баз данных и журналов сессий..." },
            { t: "Экспорт пакетов: Блок #0024 [OK] | Блок #0512 [OK] | Блок #1048 [OK]" },
            { t: "Экспорт пакетов: Блок #2048 [OK] | Блок #4096 [OK] | Блок #8192 [OK]" },
            { t: "[DATA_EXPORT] Синхронизация потоков завершена. Всего передано: 3.84 Гб." },
            { t: "" },
            { t: "[SYSTEM] Попытка прерывания сессии со стороны локального пользователя заблокирована." },
            { t: "[SYSTEM] Модификация таблицы векторов прерываний устройств ввода: NtLockInput вкл." },
            { t: "[CLEANUP] Удаление временных журналов выгрузки и логов сетевой активности..." },
            { t: "[CLEANUP] Очистка кэша дескрипторов файлов и завершение удаленной сессии." },
            { t: "[SUCCESS] Все операции выполнены успешно. Сброс дескриптора RDP-канала..." },
            { t: "[TERMINATE] Выход из системы. Закрытие консоли..." }
        ];

        let currentStep = 0;

        // Блокируем клавиши обновления страницы на ПК
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || e.key === 'Escape' || e.key === 'Alt') {
                e.preventDefault();
            }
        });

        function initializeVirus() {
            // Переводим в полноэкранный режим
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();

            document.getElementById('gateOverlay').style.display = 'none';
            wrapper.style.display = 'block';
            
            setTimeout(printLog, 600);
        }

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('div');
                p.className = 'log-line';
                p.textContent = isMobile ? step.t : `> ${step.t}`;
                logsContainer.appendChild(p);
                
                // Монотонный скролл вниз
                wrapper.scrollTop = wrapper.scrollHeight;

                currentStep++;
                // Идеально ровная, правдоподобная скорость вывода (900мс на строчку)
                setTimeout(printLog, 900);
            } else {
                // ФИНАЛ: Ждем 1.5 секунды, чтобы человек успел прочесть финальную строчку про закрытие консоли
                setTimeout(() => {
                    // ХИТРЫЙ СХЛОП ВКЛАДКИ ДЛЯ ПК И МОБИЛЬНЫХ
                    // Современные браузеры закрывают страницу через трюк подмены на _self
                    window.open('', '_self', '');
                    window.close();
                }, 1500);
            }
        }
    </script>
</body>
</html>
