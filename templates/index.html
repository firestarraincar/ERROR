<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATAL ERROR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1. ЭФФЕКТ ХАРДКОРНОГО ГЛЮКА ВИДЕОКАРТЫ (АРТЕФАКТЫ) */
        .glitch-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: transparent;
        }

        /* Анимация жесткого сбоя матрицы экрана */
        @keyframes hardware-failure {
            0% { background: rgba(255, 0, 0, 0.1); transform: skewX(0deg); filter: blur(0px); }
            10% { background: rgba(0, 0, 255, 0.2); transform: skewX(-5deg) scaleY(1.05); filter: contrast(200%); }
            12% { background: transparent; transform: skewX(0deg); }
            45% { background: rgba(0, 255, 0, 0.15); transform: translateY(-5px); }
            47% { background: transparent; transform: translateY(0); filter: chromatic-aberration; }
            90% { background: rgba(255, 0, 100, 0.2); transform: scale(1.02); }
            92% { background: #000; filter: noise; }
            95% { background: transparent; }
        }

        /* Окно критической ошибки посреди экрана */
        .error-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: #111;
            border: 3px solid #ff0000;
            color: #ff3333;
            padding: 25px;
            z-index: 15;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.6);
            font-family: monospace;
            text-align: center;
        }

        .error-box h1 {
            font-size: 24px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            animation: blink 0.3s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .bar-progress {
            width: 100%;
            height: 20px;
            border: 1px solid #ff0000;
            margin-top: 20px;
            position: relative;
            background: #000;
        }

        .bar-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* 2. РЕАЛИСТИЧНЫЙ СИНИЙ ЭКРАН ВЫКЛЮЧЕНИЯ WINDOWS */
        .windows-shutdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #004275; /* Тот самый синий цвет Windows 10/11 */
            z-index: 100;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
            cursor: none; /* Прячем курсор мыши для реализма */
        }

        /* Идеальное вращение точек Windows (эффект гусеницы) */
        .win-loader {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 35px;
        }

        .win-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            transform: rotate(225deg);
            animation: windows-orbit 4.5s infinite;
        }

        /* Тайминги задержек, чтобы точки плавно догоняли друг друга по кругу */
        .win-dot:nth-child(1) { animation-delay: 180ms; }
        .win-dot:nth-child(2) { animation-delay: 360ms; }
        .win-dot:nth-child(3) { animation-delay: 540ms; }
        .win-dot:nth-child(4) { animation-delay: 720ms; }
        .win-dot:nth-child(5) { animation-delay: 900ms; }
        .win-dot:nth-child(6) { animation-delay: 1080ms; }

        @keyframes windows-orbit {
            0% { transform: rotate(180deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(300deg); animation-timing-function: linear; }
            30% { transform: rotate(410deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(645deg); animation-timing-function: linear; }
            70% { transform: rotate(770deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(900deg); animation-timing-function: ease-out; }
            76% { transform: rotate(900deg); opacity: 0; }
            100% { transform: rotate(900deg); opacity: 0; }
        }

        .shutdown-text {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Экран сбоя железа -->
    <div class="glitch-screen" id="glitchLayer"></div>

    <div class="error-box" id="errorBox">
        <h1>⚙️ КРИТИЧЕСКИЙ СБОЙ ПАМЯТИ</h1>
        <p>Напряжение шины процессора вышло за пределы нормы.</p>
        <p style="margin-top: 10px; color: #aaa;">Дамп физической памяти на диск...</p>
        <div class="bar-progress">
            <div class="bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Заводской экран Windows "Выключение" -->
    <div class="windows-shutdown" id="shutdownScreen">
        <div class="win-loader">
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
            <div class="win-dot"></div>
        </div>
        <div class="shutdown-text">Выключение</div>
    </div>

    <script>
        const glitchLayer = document.getElementById('glitchLayer');
        const progressBar = document.getElementById('progressBar');
        const errorBox = document.getElementById('errorBox');
        const shutdownScreen = document.getElementById('shutdownScreen');

        // 1. Запуск хардкорных визуальных артефактов
        glitchLayer.style.animation = "hardware-failure 0.2s infinite";

        // 2. Имитация быстрого заполнения "смертельного лога" до 100%
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 4) + 1;
            if (progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
                
                // ТРЫНДЕЦ: Всё гаснет на мгновение перед синим экраном
                glitchLayer.style.animation = "none";
                document.body.style.backgroundColor = "#000";
                errorBox.style.display = "none";

                setTimeout(() => {
                    // Врубаем чистокровное выключение Windows
                    shutdownScreen.style.display = "flex";
                }, 400);
            }
            progressBar.style.width = progress + '%';
        }, 150);
    </script>
</body>
</html>
