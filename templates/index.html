<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SYSTEM TERMINATION IN PROGRESS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }
        #viewport-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #020202;
            transition: transform 0.5s cubic-bezier(0.15, 0.85, 0.3, 1.3);
            transform-origin: center center;
        }
        /* Жесткие аналоговые помехи для создания лагов */
        .glitch-scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 6px, 8px 100%;
            z-index: 20;
            pointer-events: none;
        }
        .stage {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        .hacker-console {
            width: 92%;
            max-width: 850px;
            height: 550px;
            background: rgba(3, 3, 3, 0.98);
            border: 1px solid #00ff33;
            box-shadow: 0 0 40px rgba(0, 255, 51, 0.1);
            display: flex;
            flex-direction: column;
        }
        .console-header {
            background: #050505;
            padding: 12px 18px;
            border-bottom: 1px solid #00ff33;
            color: #00ff33;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .console-body {
            padding: 22px;
            color: #00ff33;
            font-size: 13px;
            line-height: 1.7;
            overflow-y: auto;
            flex-grow: 1;
        }
        .ln-info { color: #00ff33; }
        .ln-warn { color: #ffaa00; font-weight: bold; }
        .ln-danger { color: #ff0033; font-weight: bold; text-shadow: 0 0 5px rgba(255,0,51,0.5); }
        
        /* Безумная тряска консоли при лагах */
        .virus-shaking {
            animation: extreme-shake 0.08s infinite alternate;
        }
        @keyframes extreme-shake {
            0% { transform: translate(4px, -2px) skewX(-2deg); filter: hue-rotate(0deg) contrast(150%); }
            100% { transform: translate(-4px, 3px) skewX(2deg); filter: hue-rotate(180deg) contrast(200%); }
        }
        .hardware-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes hardware-die-burst {
            0% { opacity: 0; }
            20% { opacity: 1; background: #ff0033; }
            50% { opacity: 0; }
            100% { opacity: 1; background: #004b7e; }
        }
        .classic-shutdown {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #004b7e;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }
        .dots-circle {
            position: relative;
            width: 65px;
            height: 65px;
            margin-bottom: 35px;
        }
        .circle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            top: 0; left: 29px;
            transform-origin: 3px 32px;
            opacity: 0;
            animation: slow-fade-orbit 2.6s infinite linear;
        }
        .circle-dot:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
        .circle-dot:nth-child(2) { transform: rotate(30deg); animation-delay: 0.21s; }
        .circle-dot:nth-child(3) { transform: rotate(60deg); animation-delay: 0.42s; }
        .circle-dot:nth-child(4) { transform: rotate(90deg); animation-delay: 0.63s; }
        .circle-dot:nth-child(5) { transform: rotate(120deg); animation-delay: 0.84s; }
        .circle-dot:nth-child(6) { transform: rotate(150deg); animation-delay: 1.05s; }
        .circle-dot:nth-child(7) { transform: rotate(180deg); animation-delay: 1.26s; }
        .circle-dot:nth-child(8) { transform: rotate(210deg); animation-delay: 1.47s; }
        .circle-dot:nth-child(9) { transform: rotate(240deg); animation-delay: 1.68s; }
        .circle-dot:nth-child(10) { transform: rotate(270deg); animation-delay: 1.89s; }
        .circle-dot:nth-child(11) { transform: rotate(300deg); animation-delay: 2.1s; }
        .circle-dot:nth-child(12) { transform: rotate(330deg); animation-delay: 2.31s; }
        @keyframes slow-fade-orbit {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
        .shutdown-label {
            font-size: 23px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        /* Разрыв видеопамяти и лаги при "отвале" */
        .gpu-artifacts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(255, 0, 85, 0.5) 30px, rgba(255, 0, 85, 0.4) 35px),
                        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0, 255, 100, 0.4) 40px, rgba(0, 255, 100, 0.3) 45px);
            z-index: 150;
            display: none;
            pointer-events: none;
        }
        .frozen-content {
            animation-play-state: paused !important;
        }
        /* ФИНАЛЬНЫЙ КРОВАВЫЙ ЭКРАН */
        .horror-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .horror-msg {
            color: #ff0011;
            font-size: 55px;
            font-weight: 900;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 35px #ff0000;
            animation: blood-pulse 1.5s infinite alternate;
        }
        @keyframes blood-pulse {
            0% { opacity: 0.2; transform: scale(0.9); filter: blur(3px); }
            100% { opacity: 1; transform: scale(1.05); filter: blur(0px); }
        }
    </style>
</head>
<body>
    <div class="glitch-scanlines"></div>

    <div id="viewport-wrapper">
        <div class="hardware-flash" id="flash"></div>
        <div class="gpu-artifacts" id="artifacts"></div>

        <div class="stage" id="mainStage">
            <div class="hacker-console" id="consoleWindow">
                <div class="console-header">
                    <span>☠️ HARDCORE_MALWARE_ATTACK.SH</span>
                    <span>THREAT: CRITICAL</span>
                </div>
                <div class="console-body" id="logs"></div>
            </div>
        </div>

        <div class="classic-shutdown" id="shutdownScreen">
            <div class="dots-circle" id="loaderCircle">
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
            </div>
            <div class="shutdown-label">Выключение</div>
        </div>
    </div>

    <div class="horror-overlay" id="finalHorrorBox">
        <div class="horror-msg">ТВОЙ КОМПЬЮТЕР МОЙ</div>
    </div>

    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');
        const consoleWindow = document.getElementById('consoleWindow');
        const shutdownScreen = document.getElementById('shutdownScreen');
        const flash = document.getElementById('flash');
        const artifacts = document.getElementById('artifacts');
        const finalBox = document.getElementById('finalHorrorBox');
        const loaderCircle = document.getElementById('loaderCircle');

        // МОЩНЫЙ ЗВУКОВОЙ ДВИЖОК
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. Реалистичный звук печати/вывода логов (быстрые щелчки данных)
        function playLogSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(Math.random() * 600 + 100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // 2. Жуткий аналоговый треск и лаги железа
        function playGlitchSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(Math.random() * 80 + 30, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // 3. Синтез страшного демонического смеха вируса
        function playEvilLaugh() {
            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    // Частота идет вниз, имитируя дьявольский хохот
                    let baseFreq = 160 - (Math.floor(i / 3) * 12);
                    osc.frequency.setValueAtTime(baseFreq + (Math.random() * 15), audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }, i * 90);
            }
        }

        const attackSteps = [
            { t: "[INFO] Развертывание эксплоита Ring-0...", type: 'ln-info' },
            { t: "[OK] Обход проактивной защиты ядра OS...", type: 'ln-info' },
            { t: "[WARN] Попытка изоляции сессии. Контр-инъекция кода...", type: 'ln-warn' },
            { t: "[SUCCESS] Системные службы безопасности принудительно остановлены.", type: 'ln-info' },
            { t: "[INFO] Сканирование секторов файловой структуры...", type: 'ln-info' },
            { t: "[OK] Обнаружены локальные тома: C:\\, D:\\, E:\\", type: 'ln-info' },
            { t: "[WARN] Защита секторов от записи преодолена.", type: 'ln-warn' },
            { t: "[DANGER] КРИТИЧЕСКОЕ ДЕЙСТВИЕ: Перезапись главной файловой таблицы MFT...", type: 'ln-danger' },
            { t: "[DANGER] Повреждено секторов: 4,096.. 16,384.. 65,536.. Выполнено.", type: 'ln-danger' },
            { t: "[INFO] Дамп конфигурации реестра скопирован на удаленный сервер.", type: 'ln-info' },
            { t: "[WARN] Опасность: Температура контроллера питания шины SMBus превысила 96°C!", type: 'ln-warn' },
            { t: "[DANGER] Необратимый сбой питания каскада процессора (CORE_VOLT_ERR).", type: 'ln-danger' },
            { t: "[INFO] Инициализация экстренного завершения работы ACPI Windows...", type: 'ln-info' },
            { t: "[DANGER] Вызвано прямое прерывание материнской платы INT 15h.", type: 'ln-danger' },
            { t: "[CRITICAL FAILURE] Операционная система уничтожена. Экран гаснет.", type: 'ln-danger' }
        ];

        let currentStep = 0;
        let glitchSoundInterval;

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('p');
                p.className = step.type;
                p.textContent = `[${new Date().toLocaleTimeString()}] ${step.t}`;
                logsContainer.appendChild(p);
                logsContainer.scrollTop = logsContainer.scrollHeight;

                // Врубаем звук клика данных при каждой строчке
                playLogSound();

                // На жестких лагах (шаг 7) экран начинает неистово трястись и трещать
                if (currentStep === 7) {
                    consoleWindow.classList.add('virus-shaking');
                    glitchSoundInterval = setInterval(playGlitchSound, 160);
                }

                currentStep++;
                // Разная задержка для реализма лагов (от 0.6 до 1.5 сек)
                setTimeout(printLog, Math.random() * 900 + 600);
            } else {
                // Вспышка сбоя железа
                flash.style.animation = "hardware-die-burst 0.5s forwards";
                clearInterval(glitchSoundInterval);
                
                setTimeout(() => {
                    document.getElementById('mainStage').style.display = 'none';
                    flash.style.animation = "none";
                    flash.style.opacity = '0';
                    shutdownScreen.style.display = 'flex';
                    
                    // Экран "Выключение" крутится 7 секунд
                    setTimeout(() => {
                        // Жесткие артефакты видеокарты
                        artifacts.style.display = 'block';
                        wrapper.style.transform = "rotate(43deg) scale(0.80)";
                        
                        // Замораживаем точки
                        loaderCircle.classList.add('frozen-content');
                        
                        // Бесконечный треск зависшей видеокарты (лагает!)
                        let freezeBuzz = setInterval(playGlitchSound, 40);
                        
                        // Спустя 4 секунды зависания - финал
                        setTimeout(() => {
                            clearInterval(freezeBuzz);
                            wrapper.style.display = 'none';
                            finalBox.style.display = 'flex'; // Показываем надпись
                            playEvilLaugh(); // Включаем жуткий смех
                        }, 4000);

                    }, 7000); 

                }, 500);
            }
        }

        // Запуск через 1.5 секунды
        setTimeout(printLog, 1500);
    </script>
</body>
</html>
