<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SYSTEM TERMINATION IN PROGRESS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }
        #viewport-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #020202;
            transition: transform 0.6s cubic-bezier(0.15, 0.85, 0.3, 1.2);
            transform-origin: center center;
        }
        .glitch-scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 20;
            pointer-events: none;
        }
        .stage {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        .hacker-console {
            width: 92%;
            max-width: 850px;
            height: 550px;
            background: rgba(3, 3, 3, 0.98);
            border: 1px solid #00ff33;
            box-shadow: 0 0 40px rgba(0, 255, 51, 0.1);
            display: flex;
            flex-direction: column;
        }
        .console-header {
            background: #050505;
            padding: 12px 18px;
            border-bottom: 1px solid #00ff33;
            color: #00ff33;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .console-body {
            padding: 22px;
            color: #00ff33;
            font-size: 13px;
            line-height: 1.7;
            overflow-y: auto;
            flex-grow: 1;
        }
        .ln-info { color: #00ff33; }
        .ln-warn { color: #ffaa00; font-weight: bold; }
        .ln-danger { color: #ff0033; font-weight: bold; text-shadow: 0 0 5px rgba(255,0,51,0.5); }
        
        .virus-shaking {
            animation: extreme-shake 0.12s infinite alternate;
        }
        @keyframes extreme-shake {
            0% { transform: translate(3px, 2px) skewX(-1deg); filter: hue-rotate(0deg) contrast(140%); }
            100% { transform: translate(-3px, -2px) skewX(1deg); filter: hue-rotate(90deg) contrast(180%); }
        }
        .hardware-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes hardware-die-burst {
            0% { opacity: 0; }
            20% { opacity: 1; background: #ff0033; }
            40% { opacity: 0; }
            60% { opacity: 1; background: #fff; }
            100% { opacity: 1; background: #004b7e; }
        }
        .classic-shutdown {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #004b7e;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }
        .dots-circle {
            position: relative;
            width: 65px;
            height: 65px;
            margin-bottom: 35px;
        }
        .circle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            top: 0; left: 29px;
            transform-origin: 3px 32px;
            opacity: 0;
            animation: slow-fade-orbit 2.6s infinite linear;
        }
        .circle-dot:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
        .circle-dot:nth-child(2) { transform: rotate(30deg); animation-delay: 0.21s; }
        .circle-dot:nth-child(3) { transform: rotate(60deg); animation-delay: 0.42s; }
        .circle-dot:nth-child(4) { transform: rotate(90deg); animation-delay: 0.63s; }
        .circle-dot:nth-child(5) { transform: rotate(120deg); animation-delay: 0.84s; }
        .circle-dot:nth-child(6) { transform: rotate(150deg); animation-delay: 1.05s; }
        .circle-dot:nth-child(7) { transform: rotate(180deg); animation-delay: 1.26s; }
        .circle-dot:nth-child(8) { transform: rotate(210deg); animation-delay: 1.47s; }
        .circle-dot:nth-child(9) { transform: rotate(240deg); animation-delay: 1.68s; }
        .circle-dot:nth-child(10) { transform: rotate(270deg); animation-delay: 1.89s; }
        .circle-dot:nth-child(11) { transform: rotate(300deg); animation-delay: 2.1s; }
        .circle-dot:nth-child(12) { transform: rotate(330deg); animation-delay: 2.31s; }
        @keyframes slow-fade-orbit {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
        .shutdown-label {
            font-size: 23px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .gpu-artifacts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 0, 85, 0.4) 40px, rgba(255, 0, 85, 0.4) 43px),
                        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0, 255, 100, 0.3) 60px, rgba(0, 255, 100, 0.3) 62px);
            z-index: 150;
            display: none;
            pointer-events: none;
        }
        
        /* Замораживаем только контент вращаемого слоя */
        .frozen-content {
            animation-play-state: paused !important;
        }

        /* ЖУТКИЙ ФИНАЛ */
        .horror-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .horror-msg {
            color: #ff0033;
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 8px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 30px #ff0000;
            animation: text-pulse 2s infinite alternate;
        }
        @keyframes text-pulse {
            0% { opacity: 0.3; transform: scale(0.95); filter: blur(2px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); }
        }
    </style>
</head>
<body>
    <div class="glitch-scanlines"></div>

    <div id="viewport-wrapper">
        <div class="hardware-flash" id="flash"></div>
        <div class="gpu-artifacts" id="artifacts"></div>

        <div class="stage" id="mainStage">
            <div class="hacker-console" id="consoleWindow">
                <div class="console-header">
                    <span>☠️ CVE_2026_OVERCLOCK_FALLBACK.SH</span>
                    <span>THREAT_LEVEL: MAXIMUM</span>
                </div>
                <div class="console-body" id="logs"></div>
            </div>
        </div>

        <div class="classic-shutdown" id="shutdownScreen">
            <div class="dots-circle" id="loaderCircle">
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
                <div class="circle-dot"></div><div class="circle-dot"></div>
            </div>
            <div class="shutdown-label">Выключение</div>
        </div>
    </div>

    <!-- Полностью изолированное окно финала поверх всего -->
    <div class="horror-overlay" id="finalHorrorBox">
        <div class="horror-msg">YOU CANNOT RUN</div>
    </div>

    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');
        const consoleWindow = document.getElementById('consoleWindow');
        const shutdownScreen = document.getElementById('shutdownScreen');
        const flash = document.getElementById('flash');
        const artifacts = document.getElementById('artifacts');
        const finalBox = document.getElementById('finalHorrorBox');
        const loaderCircle = document.getElementById('loaderCircle');

        // ИНИЦИАЛИЗАЦИЯ СИСТЕМНОГО ГОЛОСА WINDOWS (Text-To-Speech)
        function saySystemWords(text, speed = 0.8, pitch = 0.3) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Сбрасываем старые очереди
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US'; // На английском звучит максимально зловеще
                msg.rate = speed;   // Замедляем темп для робо-эффекта
                msg.pitch = pitch;  // Опускаем тон до замогильного
                window.speechSynthesis.speak(msg);
            }
        }

        const attackSteps = [
            { t: "[INFO] Инициализация скрытого дескриптора ядра...", type: 'ln-info', voice: "Alert. Core override initiated." },
            { t: "[OK] Обход подсистемы безопасности Windows Defender...", type: 'ln-info' },
            { t: "[WARN] Выполнение контр-инъекции в стек вызовов...", type: 'ln-warn' },
            { t: "[SUCCESS] Драйвер фильтра файловой системы отключен.", type: 'ln-info' },
            { t: "[INFO] Поиск векторов монтирования дисков...", type: 'ln-info' },
            { t: "[OK] Найдено: Диск C:\\ [NTFS], Диск D:\\ [NTFS].", type: 'ln-info', voice: "Hard drives compromised." },
            { t: "[WARN] Попытка блокировки ввода-вывода... Подавление...", type: 'ln-warn' },
            { t: "[DANGER] ВНИМАНИЕ: Запущена очистка секторов MFT/GUID...", type: 'ln-danger', voice: "Deleting partition tables." },
            { t: "[DANGER] Очистка кэша дескрипторов файлов... Успешно.", type: 'ln-danger' },
            { t: "[INFO] Данные токенов зашифрованы и отправлены в сеть.", type: 'ln-info' },
            { t: "[WARN] Критическая ошибка шины SMBus! Перегрузка по току.", type: 'ln-warn', voice: "Hardware danger. Voltage failure." },
            { t: "[DANGER] Сбой питания южного моста материнской платы.", type: 'ln-danger' },
            { t: "[INFO] Принудительная отправка ACPI-запроса STATE_S5...", type: 'ln-info' },
            { t: "[DANGER] Вызов прерывания процессора INT 19h (HALT)...", type: 'ln-danger', voice: "Fatal crash. Subsystem shutdown." },
            { t: "[CRITICAL SYSTEM FAILURE] Система завершает работу.", type: 'ln-danger' }
        ];

        let currentStep = 0;

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('p');
                p.className = step.type;
                p.textContent = `[${new Date().toLocaleTimeString()}] ${step.t}`;
                logsContainer.appendChild(p);
                logsContainer.scrollTop = logsContainer.scrollHeight;

                if (currentStep === 7) {
                    consoleWindow.classList.add('virus-shaking');
                }

                // Если у шага прописан голос — заставляем Windows говорить
                if (step.voice) {
                    saySystemWords(step.voice);
                }

                currentStep++;
                setTimeout(printLog, Math.random() * 900 + 700);
            } else {
                flash.style.animation = "hardware-die-burst 0.5s forwards";
                
                setTimeout(() => {
                    document.getElementById('mainStage').style.display = 'none';
                    flash.style.animation = "none";
                    flash.style.opacity = '0';
                    shutdownScreen.style.display = 'flex';
                    
                    // Windows медленно крутится 6 секунд
                    setTimeout(() => {
                        artifacts.style.display = 'block';
                        wrapper.style.transform = "rotate(43deg) scale(0.82)";
                        
                        // Замораживаем только точки, не ломая остальной JS
                        loaderCircle.classList.add('frozen-content');
                        
                        // Жуткий металлический голос сообщает об окончательном взломе
                        saySystemWords("Goodbye. Your computer is mine.", 0.6, 0.1);
                        
                        // Спустя 4 секунды зависания под углом - врубаем финальный экран
                        setTimeout(() => {
                            wrapper.style.display = 'none';
                            finalBox.style.display = 'flex'; // Гарантированно открываем надпись
                        }, 4000);

                    }, 6000); 

                }, 500);
            }
        }

        setTimeout(printLog, 1500);
    </script>
</body>
</html>
