<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            /* Системный шрифт смартфонов и ПК по умолчанию */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Барьер для входа (обязателен для разблокировки Fullscreen на смартфонах) */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-btn {
            background: transparent;
            border: 1px solid #222222;
            color: #555555;
            padding: 14px 40px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Главный контейнер (повернется на 43 градуса) */
        #viewport-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000000;
            transition: transform 0.5s ease-in-out;
            transform-origin: center center;
            display: none;
            padding: 30px 20px;
        }

        /* Экран системных логов прошивки/обновления */
        .system-stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-line {
            width: 100%;
            word-break: break-all;
            margin-bottom: 4px;
        }

        /* Фирменные артефакты "поплывшего" экрана смартфона */
        .screen-damage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255, 0, 0, 0.15) 15px, rgba(255, 0, 0, 0.15) 16px),
                        repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0, 0, 255, 0.1) 20px, rgba(0, 0, 255, 0.1) 21px);
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        /* КРОВАВАЯ НАДПИСЬ НАМЕРТВО ПОВЕРХ ВСЕГО */
        .horror-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
        }
        .horror-msg {
            color: #ff0516;
            font-size: 32px; /* Идеальный размер под экраны мобильных */
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 25px #ff0000;
            padding: 0 20px;
            animation: blood-pulse 1.4s infinite alternate;
        }
        @keyframes blood-pulse {
            0% { opacity: 0.3; transform: scale(0.97); filter: blur(1px); }
            100% { opacity: 1; transform: scale(1.03); filter: blur(0px); }
        }
    </style>
</head>
<body>
    <!-- Неброская кнопка авторизации для включения Fullscreen на iOS/Android -->
    <div class="start-overlay" id="gateOverlay">
        <button class="start-btn" onclick="initializeVirus()">Продолжить</button>
    </div>

    <div id="viewport-wrapper">
        <div class="screen-damage" id="artifacts"></div>

        <div class="system-stage">
            <div id="logs"></div>
        </div>

        <!-- Кровавый текст внутри вращаемой зоны -->
        <div class="horror-overlay" id="finalHorrorBox">
            <div class="horror-msg">ТВОЙ КОМПЬЮТЕР МОЙ</div>
        </div>
    </div>
    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');
        const artifacts = document.getElementById('artifacts');
        const finalBox = document.getElementById('finalHorrorBox');

        // Мобильные и серверные логи, имитирующие официальную прошивку/дамп
        const attackSteps = [
            { t: "Android Bootloader Utility v4.19.0-release" },
            { t: "SYS_INIT: Проверка разделов памяти устройства..." },
            { t: "Storage: eMMC/UFS internal flash detected." },
            { t: "Partition Check: /system [OK], /vendor [OK], /data [OK]" },
            { t: "Инициализация безопасного шлюза загрузки..." },
            { t: "[ВНИМАНИЕ] Обнаружено стороннее сетевое подключение: Bridge_Interface_v4" },
            { t: "[СЕТЬ] Удаленный адрес хоста: 185.220.101.5 (Швеция, Стокгольм)" },
            { t: "[БЕЗОПАСНОСТЬ] Запрос на чтение зашифрованного хранилища ключей Keystore..." },
            { t: "[БЕЗОПАСНОСТЬ] Доступ предоставлен (Уровень привилегий: ROOT_SYSTEM)" },
            { t: "Запущена фоновая выгрузка пакетов конфигурации во внешний кэш..." },
            { t: "Синхронизация каталогов: /data/user/0/com.android.providers... 12%" },
            { t: "Синхронизация каталогов: /data/user/0/com.android.providers... 48%" },
            { t: "Синхронизация каталогов: /data/user/0/com.android.providers... 89%" },
            { t: "Выгрузка пользовательского архива завершена успешно (Размер: 3.8 Гб)." },
            { t: "[СИСТЕМА] Попытка принудительной перезагрузки устройства пользователем..." },
            { t: "[СИСТЕМА] Отклонено. Служба ввода ввода блокирована аппаратным флагом NtLock." },
            { t: "Модификация ядра: Внедрение патча системных дескрипторов..." },
            { t: "Статус выполнения: Ожидание подтверждения удаленного оператора..." }
        ];

        let currentStep = 0;

        // Полная блокировка стандартных клавиш управления на ПК
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || e.key === 'Escape' || e.key === 'Alt') {
                e.preventDefault();
            }
        });

        function initializeVirus() {
            // Включаем полноэкранный режим (работает и на ПК, и на смартфонах)
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();

            document.getElementById('gateOverlay').style.display = 'none';
            wrapper.style.display = 'block';

            // На телефонах текст «Твой компьютер мой» динамически меняется на «Твое устройство мое»
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                document.querySelector('.horror-msg').textContent = 'ТВОЕ УСТРОЙСТВО МОЕ';
            }
            
            setTimeout(printLog, 600);
        }

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('div');
                p.className = 'log-line';
                p.textContent = `> ${step.t}`;
                logsContainer.appendChild(p);

                currentStep++;
                // Идеально ровный и гладкий вывод строк без лагов и пафоса
                setTimeout(printLog, 850);
            } else {
                // ФИНАЛ: Экран тихо застывает, косится и выводит текст
                setTimeout(() => {
                    artifacts.style.display = 'block';
                    // Плавный завал на 43 градуса
                    wrapper.style.transform = "rotate(43deg) scale(0.85)";
                    
                    setTimeout(() => {
                        finalBox.style.display = 'flex';
                    }, 400);

                }, 1200);
            }
        }
    </script>
</body>
</html>
