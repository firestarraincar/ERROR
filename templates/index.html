<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Diagnostics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Минималистичная незаметная кнопка */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-btn {
            background: transparent;
            border: 1px solid #222222;
            color: #444444;
            padding: 12px 35px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
        }

        #viewport-wrapper {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none;
            padding: 25px 20px;
        }

        .system-stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            color: #d4d4d4;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-line {
            width: 100%;
            word-break: break-all;
            margin-bottom: 3px;
        }

        /* Строгий, официальный финальный текст */
        .final-notice {
            margin-top: 20px;
            color: #ff2233;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Кнопка для обхода политик безопасности браузера -->
    <div class="start-overlay" id="gateOverlay">
        <button class="start-btn" onclick="initializeVirus()">Продолжить</button>
    </div>

    <div id="viewport-wrapper">
        <div class="system-stage">
            <div id="logs"></div>
            <div class="final-notice" id="horrorText">ТВОЙ КОМПЬЮТЕР МОЙ</div>
        </div>
    </div>
    <script>
        const wrapper = document.getElementById('viewport-wrapper');
        const logsContainer = document.getElementById('logs');
        const horrorText = document.getElementById('horrorText');

        const cpuCores = navigator.hardwareConcurrency || 4;
        const userAgent = navigator.userAgent;
        let detectedOS = "Windows 10/11 Pro (x64)";
        if (/Android|iPhone|iPad/i.test(userAgent)) detectedOS = "Mobile ARMv8 Kernel";

        const attackSteps = [
            { t: "Microsoft Windows Diagnostics Subsystem [Build 22631]" },
            { t: `[SYS] Считывание аппаратной конфигурации... Процессор: ${cpuCores} Cores | Платформа: ${detectedOS}` },
            { t: "[SYS] Служба теневого копирования томов vssadmin успешно остановлена." },
            { t: "[NET] Входящее RDP-соединение установлено по протоколу шифрования TLSv1.3." },
            { t: "[NET] Сессия удаленного оператора: 185.220.101.5 (Стокгольм, Швеция)." },
            { t: "[AUTH] Права локального доступа повышены до идентификатора NT AUTHORITY\\SYSTEM." },
            { t: "[DATA] Запущен экспорт системных журналов и кэша учетных записей (размер: 3.8 Гб)..." },
            { t: "Синхронизация блоков данных: [====================] 100% Выгрузка завершена." },
            { t: "[СИСТЕМА] Обнаружена попытка вмешательства локального пользователя." },
            { t: "[БЛОКИРОВКА] Перехват управления диспетчером задач завершен." },
            { t: "[БЛОКИРОВКА] Закрытие сессии RDP ограничено политикой локальной безопасности." },
            { t: "[ИНФО] Ожидание подтверждения удаленного сервера..." }
        ];

        let currentStep = 0;

        // 1. БЛОКИРОВКА ЗАКРЫТИЯ ВКЛАДКИ (Политика BeforeUnload)
        // Браузер при попытке закрыть страницу или нажать "Назад" выдаст официальное окно-предупреждение
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Внимание! Процесс шифрования системы не завершен. Закрытие страницы приведет к потере данных.';
            return e.returnValue;
        });

        // 2. БЛОКИРОВКА ОБНОВЛЕНИЯ КЛАВИШАМИ
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || e.key === 'Escape' || e.key === 'Alt' || e.key === 'Backspace') {
                e.preventDefault();
            }
        });

        // 3. БЛОКИРОВКА ИСТОРИИ (Кнопка "Назад" на телефонах)
        // Скрипт бесконечно спамит фейковую историю, чтобы кнопка "Назад" в браузере телефона просто обновляла эту же страницу
        function blockBackButton() {
            window.history.pushState(null, null, window.location.href);
        }
        window.addEventListener('popstate', blockBackButton);

        function initializeVirus() {
            // Разворачиваем на весь экран
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();

            document.getElementById('gateOverlay').style.display = 'none';
            wrapper.style.display = 'block';

            // Настраиваем надпись под тип устройства
            if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
                horrorText.textContent = 'ТВОЕ УСТРОЙСТВО МОЕ';
            }
            
            // Бесконечно забиваем историю браузера для блокировки кнопки назад
            blockBackButton();
            setInterval(blockBackButton, 100);

            setTimeout(printLog, 600);
        }

        function printLog() {
            if (currentStep < attackSteps.length) {
                const step = attackSteps[currentStep];
                const p = document.createElement('div');
                p.className = 'log-line';
                p.textContent = `> ${step.t}`;
                logsContainer.appendChild(p);

                // Плавная прокрутка логов
                logsContainer.parentNode.scrollTop = logsContainer.parentNode.scrollHeight;

                currentStep++;
                setTimeout(printLog, 900);
            } else {
                // Без всяких эффектов просто выводим финальную строку внизу
                setTimeout(() => {
                    horrorText.style.display = 'block';
                    logsContainer.parentNode.scrollTop = logsContainer.parentNode.scrollHeight;
                }, 1000);
            }
        }
    </script>
</body>
</html>
